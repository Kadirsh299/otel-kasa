{% extends "base.html" %}{% block icerik %}
<div class="kart">
<h3>💸 Yeni Gider Ekle</h3>
<form method="post" action="{{ url_for('gider_ekle') }}" class="form-row">
<input name="aciklama" placeholder="Açıklama (ör: Temizlik malzemesi)" required>
<input name="tutar" placeholder="Tutar (TL)" required type="number" step="0.01">
<button class="btn btn-kirmizi" type="submit">GİDER EKLE</button>
</form>
</div>
<div class="kart">
<h3>📋 Gider Listesi</h3>
<div style="overflow-x:auto">
<table>
<tr><th>Açıklama</th><th>Tutar</th><th>Tarih</th><th>Personel</th></tr>
{% for g in giderler %}
<tr><td>{{ g.aciklama }}</td><td>{{ "%.2f"|format(g.tutar) }} TL</td>
<td>{{ g.tarih.strftime("%d.%m.%Y %H:%M") }}</td><td>{{ g.personel }}</td></tr>
{% endfor %}
</table>
</div>
</div>
{% endblock %}
