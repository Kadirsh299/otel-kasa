<!DOCTYPE html><html><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Otel Kasa - Giriş</title>
<style>
body{font-family:-apple-system,Arial;background:linear-gradient(135deg,#1e293b,#334155);color:white;display:flex;justify-content:center;align-items:center;min-height:100vh;margin:0;padding:20px}
.kutu{background:rgba(255,255,255,.1);backdrop-filter:blur(10px);padding:40px 30px;border-radius:16px;width:340px;box-shadow:0 20px 50px rgba(0,0,0,.4);border:1px solid rgba(255,255,255,.1)}
h1{text-align:center;margin:0 0 25px;font-size:24px}
input{width:100%;padding:14px;margin:8px 0;border:none;border-radius:10px;box-sizing:border-box;font-size:16px;background:rgba(255,255,255,.9)}
button{width:100%;padding:14px;background:#3b82f6;color:white;border:none;border-radius:10px;font-size:16px;font-weight:bold;cursor:pointer;margin-top:10px}
button:hover{background:#2563eb}
.uyari{background:#dc2626;padding:12px;border-radius:8px;margin-bottom:15px;font-size:14px;text-align:center}
</style></head><body>
<div class="kutu">
<h1>🏨 Otel Kasa</h1>
{% with msgs = get_flashed_messages(with_categories=true) %}
{% for cat, m in msgs %}<div class="uyari">{{ m }}</div>{% endfor %}
{% endwith %}
<form method="post">
<input name="username" placeholder="Kullanıcı adı" required autofocus>
<input name="password" type="password" placeholder="Şifre" required>
<button type="submit">GİRİŞ YAP</button>
</form>
</div></body></html>
